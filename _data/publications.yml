- id: covid-protective-behavior
  featured: true
  venue: "Scientific Reports &middot; Vol. 13, Article 6121 &middot; 2023"
  title: "A machine learning approach to predict self-protecting behaviors during the early wave of the COVID-19 pandemic"
  blurb: "Non-parametric ML model identifying predictors of protective behaviour across five European countries."
  abstract: "Using a unique harmonised real‐time data set from the COME-HERE longitudinal survey that covers five European countries (France, Germany, Italy, Spain, and Sweden) and applying a non-parametric machine learning model, we identify the main individual and macro-level predictors of self-protecting behaviours against the coronavirus disease 2019 (COVID-19) during the first wave of the pandemic. Exploiting the interpretability of a Random forest algorithm via Shapely values, we find that a higher regional incidence of COVID-19 triggers higher levels of self-protective behaviour, as does a stricter government policy response. The level of individual knowledge about the pandemic, confidence in institutions, and population density also ranks high among the factors that predict self-protecting behaviours. We also identify a steep socioeconomic gradient with lower levels of self-protecting behaviours being associated with lower income and poor housing conditions. Among socio-demographic factors, gender, marital status, age, and region of residence are the main determinants of self-protective measures."
  tags: ["COVID-19", "Individual Behavior", "Machine Learning", "Policy Response"]
  citation: "Taye, A. D., Borga, L. G., Greiff, S. et al. A machine learning approach to predict self-protecting behaviors during the early wave of the COVID-19 pandemic. <em>Sci Rep</em> 13, 6121 (2023)."
  link_url: "https://doi.org/10.1038/s41598-023-33033-1"
  link_label: "Read on Nature.com"

- id: material-social-deprivations
  featured: false
  venue: "Vie & Sciences de l'Entreprise &middot; No. 226-227 &middot; 2025"
  title: "Predicting Material and Social Deprivations with Machine Learning"
  blurb: "Machine learning classification of material and social deprivation status using EU-SILC microdata."
  abstract: "Using the European Union Statistics on Income and Living Conditions (EU-SILC) microdata and applying machine learning (ML) algorithms, I explore the questions: 1) How accurately can one classify unseen individuals' deprivations status given their observable personal, household, and country-specific factors? 2) What is the performance of targeting subsets of features, such as sociodemographic, socioeconomic, health, and location, to identify the deprived? 3) What are the key predictors and their partial effects? Key results of the empirical analysis demonstrate that the relative accuracy gained by using the sophisticated tree-based ML algorithm is positive and significant compared to that of the standard Generalised linear model (7.3% relative gain with the Extreme gradient boosted trees and 5.9% with the Random forests). Socioeconomic factors yield a classification accuracy as close as when the whole set of features is considered. Feature importance and partial effect analysis identified with Shapley's value reveal insightful relationships consistent with theoretical and empirical evidence."
  tags: ["Deprivation", "Machine Learning", "EU-SILC", "Classification", "Economic Precariousness"]
  citation: "Taye, A. D. (2025). Predicting material and social deprivations with machine learning. <em>Vie & Sciences de l'Entreprise</em>, 226-227(3-4), 402–419."
  link_url: "https://shs.cairn.info/revista-vie-sciences-de-lentreprise-2025-3-page-402?lang=es"
  link_label: "Read on Cairn.info"

- id: vulnerability-to-poverty
  featured: true
  venue: "Forthcoming &middot; The Journal of Economic Inequality"
  title: "Vulnerability to Poverty: An Explainable Machine Learning Approach"
  blurb: "Random Forest / GBT / NN models outperform OLS baselines on German SOEP panel data."
  abstract: "Building on the definition of vulnerability as expected poverty, we train supervised machine-learning algorithms and a baseline OLS using the German Socio-Economic Panel (version 37) data for years 1984-2020 under two scenarios: 1) considering only cross-sectional data; 2) using over time information on the relative position of the household in the income distribution. Random Forest (RF), Gradient boosted trees (GBT), and Neural Networks (NN) predict the vulnerable group on average by 20%, 15.3%, and 12,3% more than the OLS in the first scenario. The hit rate and the overall accuracy of all vulnerability estimates increase in the second scenario, but the sensitivity gains shrink to 15.6%, 11.5%, and 6.6%, respectively. With Shapely values from the RF model, we explain the sources of vulnerability and their evolution. We find that weak ties to the labour market, single-person households, the number of dependants in the family, living in East Germany, and the sociodemographic characteristics of household head are associated with vulnerability to poverty."
  tags: ["Machine Learning", "Vulnerability", "Poverty", "Wellbeing", "SOEP"]
  citation: "Taye, A. D., & D'Ambrosio, C. (forthcoming). Vulnerability to poverty: An explainable machine learning approach. <em>The Journal of Economic Inequality</em>."
  link_url: ""
  link_label: ""
