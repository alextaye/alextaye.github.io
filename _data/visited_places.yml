# Countries/cities visited, shown on activities.md ("Places I have been").
# To add a new place: add one entry below (or one city to an existing
# country's `cities` list) - the stat counts and the highlighted country
# on the map are both generated from this file, nothing else to change.
#
# `code` is the ISO 3166-1 alpha-2 country code, used to match and
# highlight the country's shape on the map (assets/data/countries-110m.geojson).
#
# NOTE: city names below are PLACEHOLDERS (mostly capitals, or inferred
# from conferences/education already listed elsewhere on the site) -
# user confirmed real cities will be supplied later to replace these.
# Cities are shown only as a count (the "Cities" stat), not on the map.
