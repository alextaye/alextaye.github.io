<!-- Real OpenStreetMap (via Leaflet - MIT-licensed, actively maintained,
     loaded from CDN with Subresource Integrity hashes pinned to a
     specific version) with visited countries highlighted as filled
     shapes. No per-city markers/popups on the map itself - cities are
     shown only as the "Cities" stat above.

     Tiles: Wikimedia's free, key-free "osm-intl" style
     (maps.wikimedia.org) - same OpenStreetMap data as the standard
     tile.openstreetmap.org renderer, but labels prefer English/
     international names instead of each place's local-language name.

     Country boundaries: assets/data/countries-110m.geojson, a trimmed
     copy of Natural Earth's public-domain 1:110m admin-0 countries
     dataset (ISO_A2 + ADMIN properties only, geometry unchanged).
     Self-hosted rather than fetched from a third party at runtime.

     Highlighted countries + the codes used to match them both come from
     _data/visited_places.yml - add a country there (with its ISO
     3166-1 alpha-2 `code`) and it lights up here automatically. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<div class="map-panel">
  <div id="visited-map"></div>
  <div class="map-caption">Visited countries highlighted. Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors, tiles courtesy of <a href="https://wikimediafoundation.org/" target="_blank" rel="noopener noreferrer">Wikimedia</a>; boundaries from <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener noreferrer">Natural Earth</a> (public domain).</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  (function () {
    var places = {{ site.data.visited_places | jsonify }};
    var namesByCode = {};
    places.forEach(function (p) { namesByCode[p.code] = p.name; });

    var map = L.map('visited-map', { scrollWheelZoom: false }).setView([25, 10], 2);
    L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18
    }).addTo(map);

    fetch('{{ "/assets/data/countries-110m.geojson" | relative_url }}')
      .then(function (res) { return res.json(); })
      .then(function (geo) {
        L.geoJSON(geo, {
          style: function (feature) {
            var visited = namesByCode.hasOwnProperty(feature.properties.ISO_A2);
            return { className: visited ? 'map-country map-country--visited' : 'map-country' };
          },
          onEachFeature: function (feature, layer) {
            var name = namesByCode[feature.properties.ISO_A2];
            if (name) layer.bindTooltip(name, { sticky: true });
          }
        }).addTo(map);
      });
  })();
</script>
