<!-- Real OpenStreetMap, rendered via Leaflet (MIT-licensed, actively
     maintained, loaded from CDN with Subresource Integrity hashes pinned
     to a specific version - not the deprecated amCharts 3 setup this
     replaced). Markers come from _data/visited_places.yml: add a place
     there and it shows up here automatically, nothing else to change. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<div class="map-panel">
  <div id="visited-map"></div>
  <div class="map-caption">Click a marker for the country and city. Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  (function () {
    var places = {{ site.data.visited_places | jsonify }};
    var map = L.map('visited-map', { scrollWheelZoom: false }).setView([30, 10], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18
    }).addTo(map);
    places.forEach(function (p) {
      L.marker([p.lat, p.lon]).addTo(map).bindPopup(p.name + ' \u2014 ' + p.cities.join(', '));
    });
  })();
</script>
